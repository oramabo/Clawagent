#!/usr/bin/env bash
# cron.conf — Configuration for the auto-dev cron daemon
#
# Source this file to load defaults. Override any value via environment
# variables before starting the daemon.

# --- Global ---
CRON_ENABLED="${CRON_ENABLED:-true}"
CRON_TICK_INTERVAL="${CRON_TICK_INTERVAL:-10}"       # Base loop sleep (seconds)
CRON_LOG_FILE="${CRON_LOG_FILE:-}"                    # Empty = stdout
CRON_STATE_DIR="${CRON_STATE_DIR:-}"                  # Empty = auto (skills/auto-dev/state/)

# --- Progress Monitor ---
CRON_JOB_MONITOR_ENABLED="${CRON_JOB_MONITOR_ENABLED:-true}"
CRON_JOB_MONITOR_INTERVAL="${CRON_JOB_MONITOR_INTERVAL:-30}"           # seconds
CRON_JOB_MONITOR_STALL_THRESHOLD="${CRON_JOB_MONITOR_STALL_THRESHOLD:-120}"  # seconds unchanged
CRON_JOB_MONITOR_STALL_ACTION="${CRON_JOB_MONITOR_STALL_ACTION:-nudge}"      # nudge | notify | restart

# --- Jira Sync ---
CRON_JOB_JIRA_ENABLED="${CRON_JOB_JIRA_ENABLED:-true}"
CRON_JOB_JIRA_INTERVAL="${CRON_JOB_JIRA_INTERVAL:-120}"               # seconds
CRON_JOB_JIRA_NOTIFY_ON="${CRON_JOB_JIRA_NOTIFY_ON:-new_task,status_change,priority_change,new_comment}"

# --- Channel Updates ---
CRON_JOB_UPDATES_ENABLED="${CRON_JOB_UPDATES_ENABLED:-true}"
CRON_JOB_UPDATES_INTERVAL="${CRON_JOB_UPDATES_INTERVAL:-300}"         # seconds
CRON_JOB_UPDATES_INCLUDE_IDLE="${CRON_JOB_UPDATES_INCLUDE_IDLE:-false}"

# --- Autonomy Enforcement ---
CRON_JOB_AUTONOMY_ENABLED="${CRON_JOB_AUTONOMY_ENABLED:-true}"
CRON_JOB_AUTONOMY_INTERVAL="${CRON_JOB_AUTONOMY_INTERVAL:-20}"        # seconds
CRON_JOB_AUTONOMY_AUTO_APPROVE="${CRON_JOB_AUTONOMY_AUTO_APPROVE:-true}"
CRON_JOB_AUTONOMY_MAX_INTERVENTIONS="${CRON_JOB_AUTONOMY_MAX_INTERVENTIONS:-50}"
CRON_JOB_AUTONOMY_APPROVAL_PATTERNS="${CRON_JOB_AUTONOMY_APPROVAL_PATTERNS:-(Y/n|y/N|Continue\?|Proceed\?|approve|permission|allow|Allow)}"
CRON_JOB_AUTONOMY_ERROR_PATTERNS="${CRON_JOB_AUTONOMY_ERROR_PATTERNS:-(ENOSPC|OOM|Killed|Segmentation fault|panic:)}"
CRON_JOB_AUTONOMY_DESTRUCTIVE_PATTERNS="${CRON_JOB_AUTONOMY_DESTRUCTIVE_PATTERNS:-(rm -rf|DROP TABLE|force push|--hard|--force)}"
